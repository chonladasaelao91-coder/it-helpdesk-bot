<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk - ระบบแจ้งซ่อม</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-slate-800 flex items-center justify-center min-h-screen p-4">
    <!-- ขนาดกล่องฟอร์มเท่าเดิม (max-w-md และ p-6) -->
    <div class="max-w-md w-full bg-white/95 backdrop-blur-xl rounded-2xl shadow-xl p-6 border border-white/30 relative overflow-hidden">
        <!-- แถบสีตกแต่งด้านบน -->
        <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-blue-600 via-indigo-600 to-emerald-400"></div>
        
        <div class="text-center mb-5 pt-1">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-gradient-to-tr from-blue-50 to-indigo-50 text-blue-600 rounded-xl text-2xl mb-2 shadow-sm border border-blue-100/50">
                💻
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">IT Helpdesk</h1>
            <p class="text-xs text-slate-600 mt-0.5 font-medium">ระบบแจ้งปัญหาและขอความช่วยเหลือจากทีม IT</p>
        </div>

        <form action="/submit" method="POST" class="space-y-4" onsubmit="this.querySelector('button[type=submit]').disabled=true; this.querySelector('button[type=submit]').innerText='กำลังส่งข้อมูล...';">
            <!-- ชื่อ-นามสกุล (ตัวหนังสือใหญ่ขึ้นเป็น text-base) -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">ชื่อ-นามสกุล (User Name)</label>
                <input type="text" name="name" required placeholder="ระบุชื่อของคุณ" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500/30 focus:border-blue-600 focus:outline-none text-base transition bg-white shadow-sm font-medium">
            </div>

            <!-- แผนก / ฝ่าย (ตัวหนังสือใหญ่ขึ้นเป็น text-base) -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">แผนก / ฝ่าย (Department)</label>
                <select name="department" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500/30 focus:border-blue-600 focus:outline-none text-base bg-white transition font-medium shadow-sm">
                    <option value="" disabled selected>-- กรุณาเลือกแผนก / ฝ่าย --</option>
                    <option value="HR">HR</option>
                    <option value="IT">IT</option>
                    <option value="Purchasing">Purchasing</option>
                    <option value="Safety">Safety</option>
                    <option value="Sale">Sale</option>
                    <option value="Finance">Finance</option>
                    <option value="Eng_AUTP">Eng_AUTP</option>
                    <option value="Eng_HEAP">Eng_HEAP</option>
                    <option value="GM_AUTP">GM_AUTP</option>
                    <option value="GM_HEAP">GM_HEAP</option>
                    <option value="PD_AUTP">PD_AUTP</option>
                    <option value="PD_HEAP">PD_HEAP</option>
                    <option value="QA_AUTP">QA_AUTP</option>
                    <option value="QA_HEAP">QA_HEAP</option>
                    <option value="QC_AUTP">QC_AUTP</option>
                    <option value="QC_HEAP">QC_HEAP</option>
                    <option value="Warehouse_AUTP">Warehouse_AUTP</option>
                    <option value="Warehouse_HEAP">Warehouse_HEAP</option>
                </select>
            </div>

            <!-- ประเภทปัญหา (ปุ่มการ์ด 2x2 ขนาดพอดีกล่อง ฟอนต์ตัวหนังสือชัดเจนขึ้น) -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">ประเภทปัญหา (Problem Type)</label>
                <div class="grid grid-cols-2 gap-2">
                    <label class="issue-card cursor-pointer border border-slate-200 bg-slate-50 hover:bg-blue-50/50 p-2.5 rounded-xl flex items-center space-x-2 transition-all">
                        <input type="radio" name="issue_type" value="คอมพิวเตอร์ / โน้ตบุ๊ก" class="hidden" checked onchange="updateCardStyle()">
                        <span class="text-xl">💻</span>
                        <span class="text-xs font-bold text-slate-800">คอมพิวเตอร์ / โน้ตบุ๊ก</span>
                    </label>

                    <label class="issue-card cursor-pointer border border-slate-200 bg-slate-50 hover:bg-blue-50/50 p-2.5 rounded-xl flex items-center space-x-2 transition-all">
                        <input type="radio" name="issue_type" value="อินเทอร์เน็ต / Network" class="hidden" onchange="updateCardStyle()">
                        <span class="text-xl">🌐</span>
                        <span class="text-xs font-bold text-slate-800">อินเทอร์เน็ต / Network</span>
                    </label>

                    <label class="issue-card cursor-pointer border border-slate-200 bg-slate-50 hover:bg-blue-50/50 p-2.5 rounded-xl flex items-center space-x-2 transition-all">
                        <input type="radio" name="issue_type" value="เครื่องพิมพ์ (Printer)" class="hidden" onchange="updateCardStyle()">
                        <span class="text-xl">🖨️</span>
                        <span class="text-xs font-bold text-slate-800">เครื่องพิมพ์ (Printer)</span>
                    </label>

                    <label class="issue-card cursor-pointer border border-slate-200 bg-slate-50 hover:bg-blue-50/50 p-2.5 rounded-xl flex items-center space-x-2 transition-all">
                        <input type="radio" name="issue_type" value="ระบบซอฟต์แวร์ / อื่นๆ" class="hidden" onchange="updateCardStyle()">
                        <span class="text-xl">⚙️</span>
                        <span class="text-xs font-bold text-slate-800">ซอฟต์แวร์ / อื่นๆ</span>
                    </label>
                </div>
            </div>

            <!-- รายละเอียดอาการ (ตัวหนังสือใหญ่ขึ้นเป็น text-base) -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">รายละเอียดอาการ (Details of symptoms)</label>
                <textarea name="detail" rows="2.5" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500/30 focus:border-blue-600 focus:outline-none text-base transition bg-white shadow-sm font-medium" placeholder="อธิบายอาการเบื้องต้น เช่น เปิดไม่ติด, ปริ้นไม่ออก..."></textarea>
            </div>

            <!-- ปุ่มส่งข้อมูล -->
            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-700 hover:from-blue-700 hover:to-indigo-800 text-white font-bold py-3 rounded-xl transition-all duration-200 shadow-md shadow-blue-600/25 text-base active:scale-[0.99] cursor-pointer mt-1">
                🚀 ส่งเรื่องแจ้งทีม IT
            </button>
        </form>

        <!-- ปุ่มทางลัดไปหน้า Dashboard -->
        <div class="mt-3.5">
            <a href="/dashboard" class="block text-center w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-sm transition border border-slate-200 shadow-sm">
                📊 ดูสถานะเคสทั้งหมดในระบบ
            </a>
        </div>
        
        <div class="text-center mt-4">
            <p class="text-[11px] text-slate-500 font-semibold">ระบบแจ้งเตือนอัตโนมัติผ่าน LINE Messaging API</p>
        </div>
    </div>

    <!-- Script สำหรับทำ Highlight ให้การ์ดที่ถูกเลือก -->
    <script>
        function updateCardStyle() {
            document.querySelectorAll('.issue-card').forEach(card => {
                const radio = card.querySelector('input[type="radio"]');
                if (radio.checked) {
                    card.classList.add('border-blue-600', 'bg-blue-50', 'ring-2', 'ring-blue-500/20', 'shadow-sm');
                    card.classList.remove('border-slate-200', 'bg-slate-50');
                } else {
                    card.classList.remove('border-blue-600', 'bg-blue-50', 'ring-2', 'ring-blue-500/20', 'shadow-sm');
                    card.classList.add('border-slate-200', 'bg-slate-50');
                }
            });
        }
        document.addEventListener('DOMContentLoaded', updateCardStyle);
    </script>
</body>
</html>
