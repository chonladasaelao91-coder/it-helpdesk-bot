<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk - ระบบแจ้งซ่อม</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-slate-800 flex items-center justify-center min-h-screen p-4 sm:p-6">
    <div class="max-w-lg w-full bg-white/95 backdrop-blur-xl rounded-3xl shadow-[0_20px_50px_rgba(8,112,184,0.15)] p-8 sm:p-10 border border-white/40 relative overflow-hidden">
        <!-- แถบสีตกแต่งด้านบนแบบเรืองแสง -->
        <div class="absolute top-0 left-0 right-0 h-2.5 bg-gradient-to-r from-blue-600 via-indigo-600 to-emerald-400"></div>
        
        <div class="text-center mb-8 pt-2">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-tr from-blue-50 to-indigo-50 text-blue-600 rounded-3xl text-4xl mb-4 shadow-sm border border-blue-100/50">
                💻
            </div>
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">IT Helpdesk</h1>
            <p class="text-base text-slate-600 mt-2 font-medium">ระบบแจ้งปัญหาและขอความช่วยเหลือจากทีม IT</p>
        </div>

        <form action="/submit" method="POST" class="space-y-5" onsubmit="this.querySelector('button[type=submit]').disabled=true; this.querySelector('button[type=submit]').innerText='กำลังส่งข้อมูล...';">
            <div>
                <label class="block text-sm font-bold uppercase tracking-wider text-slate-700 mb-2">ชื่อ-นามสกุล (User Name)</label>
                <input type="text" name="name" required placeholder="ระบุชื่อของคุณ" class="w-full px-5 py-3.5 rounded-2xl border-2 border-slate-200 focus:ring-4 focus:ring-blue-500/20 focus:border-blue-600 focus:outline-none text-lg transition bg-white shadow-sm font-medium">
            </div>

            <div>
                <label class="block text-sm font-bold uppercase tracking-wider text-slate-700 mb-2">แผนก / ฝ่าย (Department)</label>
                <select name="department" required class="w-full px-5 py-3.5 rounded-2xl border-2 border-slate-200 focus:ring-4 focus:ring-blue-500/20 focus:border-blue-600 focus:outline-none text-lg bg-white transition font-medium shadow-sm">
                    <option value="" disabled selected>-- กรุณาเลือกแผนก / ฝ่าย --</option>
                    <option value="HR">HR</option>
                    <option value="IT">IT</option>
                    <option value="Purchasing">Purchasing</option>
                    <option value="Safety">Safety</option>
                    <option value="Sale">Sale</option>
                    <option value="Finance">Finance</option>
                    <option value="Eng_AUTP">Eng_AUTP</option>
                    <option value="Eng_HEAP">Eng_HEAP</option>
                    <option value="GM_AUTP">GM_AUTP</option>
                    <option value="GM_HEAP">GM_HEAP</option>
                    <option value="PD_AUTP">PD_AUTP</option>
                    <option value="PD_HEAP">PD_HEAP</option>
                    <option value="QA_AUTP">QA_AUTP</option>
                    <option value="QA_HEAP">QA_HEAP</option>
                    <option value="QC_AUTP">QC_AUTP</option>
                    <option value="QC_HEAP">QC_HEAP</option>
                    <option value="Warehouse_AUTP">Warehouse_AUTP</option>
                    <option value="Warehouse_HEAP">Warehouse_HEAP</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold uppercase tracking-wider text-slate-700 mb-2">ประเภทปัญหา (Problem Type)</label>
                <select name="issue_type" class="w-full px-5 py-3.5 rounded-2xl border-2 border-slate-200 focus:ring-4 focus:ring-blue-500/20 focus:border-blue-600 focus:outline-none text-lg bg-white transition font-medium shadow-sm">
                    <option value="คอมพิวเตอร์ / โน้ตบุ๊ก">💻 Computer / Notebook</option>
                    <option value="อินเทอร์เน็ต / Network">🌐 อินเทอร์เน็ต / Network</option>
                    <option value="เครื่องพิมพ์ (Printer)">🖨️ เครื่องพิมพ์ (Printer)</option>
                    <option value="ระบบซอฟต์แวร์ / อื่นๆ">⚙️ ระบบซอฟต์แวร์ / อื่นๆ</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold uppercase tracking-wider text-slate-700 mb-2">รายละเอียดอาการ (Details of symptoms)</label>
                <textarea name="detail" rows="3" required class="w-full px-5 py-3.5 rounded-2xl border-2 border-slate-200 focus:ring-4 focus:ring-blue-500/20 focus:border-blue-600 focus:outline-none text-lg transition bg-white shadow-sm font-medium" placeholder="อธิบายอาการเบื้องต้น เช่น เปิดไม่ติด, ปริ้นไม่ออก..."></textarea>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-700 hover:from-blue-700 hover:to-indigo-800 text-white font-extrabold py-4 rounded-2xl transition-all duration-300 shadow-xl shadow-blue-600/30 text-lg active:scale-[0.99] cursor-pointer mt-2">
                🚀 ส่งเรื่องแจ้งทีม IT
            </button>
        </form>

        <!-- ปุ่มทางลัดไปหน้า Dashboard -->
        <div class="mt-5">
            <a href="/dashboard" class="block text-center w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3.5 rounded-2xl text-base transition-all border-2 border-slate-200/80 shadow-sm hover:shadow">
                📊 ดูสถานะเคสทั้งหมดในระบบ
            </a>
        </div>
        
        <div class="text-center mt-6">
            <p class="text-xs sm:text-sm text-slate-500 font-semibold tracking-wide">ระบบแจ้งเตือนอัตโนมัติผ่าน LINE Messaging API</p>
        </div>
    </div>
</body>
</html>
