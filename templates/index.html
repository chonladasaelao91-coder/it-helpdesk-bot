<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk - ระบบแจ้งซ่อม</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 text-slate-800 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-white/20 relative overflow-hidden">
        <!-- แถบสีตกแต่งด้านบน -->
        <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-blue-500 via-indigo-500 to-emerald-400"></div>
        
        <div class="text-center mb-6 pt-1">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl text-3xl mb-3 shadow-inner">
                💻
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">IT Helpdesk</h1>
            <p class="text-sm text-slate-600 mt-1 font-semibold">ระบบแจ้งปัญหาและขอความช่วยเหลือจากทีม IT</p>
        </div>

        <form action="/submit" method="POST" class="space-y-4" onsubmit="this.querySelector('button[type=submit]').disabled=true; this.querySelector('button[type=submit]').innerText='กำลังส่งข้อมูล...';">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">ชื่อ-นามสกุล (User Name)</label>
                <!-- ปรับขนาดตัวหนังสือภายในช่องเป็น text-base (16px) โดยไม่เพิ่มความหนาช่อง -->
                <input type="text" name="name" required placeholder="ระบุชื่อของคุณ" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:outline-none text-base transition bg-slate-50/50">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">แผนก / ฝ่าย (Department)</label>
                <select name="department" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:outline-none text-base bg-slate-50/50 transition font-medium">
                    <option value="" disabled selected>-- กรุณาเลือกแผนก / ฝ่าย --</option>
                    <option value="HR">HR</option>
                    <option value="IT">IT</option>
                    <option value="Purchasing">Purchasing</option>
                    <option value="Safety">Safety</option>
                    <option value="Sale">Sale</option>
                    <option value="Finance">Finance</option>
                    <option value="Eng_AUTP">Eng_AUTP</option>
                    <option value="Eng_HEAP">Eng_HEAP</option>
                    <option value="GM_AUTP">GM_AUTP</option>
                    <option value="GM_HEAP">GM_HEAP</option>
                    <option value="PD_AUTP">PD_AUTP</option>
                    <option value="PD_HEAP">PD_HEAP</option>
                    <option value="QA_AUTP">QA_AUTP</option>
                    <option value="QA_HEAP">QA_HEAP</option>
                    <option value="QC_AUTP">QC_AUTP</option>
                    <option value="QC_HEAP">QC_HEAP</option>
                    <option value="Warehouse_AUTP">Warehouse_AUTP</option>
                    <option value="Warehouse_HEAP">Warehouse_HEAP</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">ประเภทปัญหา (Problem Type)</label>
                <select name="issue_type" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:outline-none text-base bg-slate-50/50 transition font-medium">
                    <option value="คอมพิวเตอร์ / โน้ตบุ๊ก">💻 Computer / Notebook</option>
                    <option value="อินเทอร์เน็ต / Network">🌐 อินเทอร์เน็ต / Network</option>
                    <option value="เครื่องพิมพ์ (Printer)">🖨️ เครื่องพิมพ์ (Printer)</option>
                    <option value="ระบบซอฟต์แวร์ / อื่นๆ">⚙️ ระบบซอฟต์แวร์ / อื่นๆ</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">รายละเอียดอาการ (Details of symptoms)</label>
                <textarea name="detail" rows="3" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:outline-none text-base transition bg-slate-50/50" placeholder="อธิบายอาการเบื้องต้น เช่น เปิดไม่ติด, ปริ้นไม่ออก..."></textarea>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-lg shadow-blue-500/25 text-base active:scale-[0.99] cursor-pointer">
                🚀 ส่งเรื่องแจ้งทีม IT
            </button>
        </form>

        <!-- ปุ่มทางลัดไปหน้า Dashboard -->
        <div class="mt-4">
            <a href="/dashboard" class="block text-center w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-2.5 rounded-xl text-sm transition border border-slate-200">
                📊 ดูสถานะเคสทั้งหมดในระบบ
            </a>
        </div>
        
        <div class="text-center mt-5">
            <p class="text-xs text-slate-500 font-semibold">ระบบแจ้งเตือนอัตโนมัติผ่าน LINE Messaging API</p>
        </div>
    </div>
</body>
</html>
